name: ice_cream_erp
description: Offline Ice Cream Industry ERP - SAP B1 power + TallyPrime UX
publish_to: 'none'
version: 1.6.0+6

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Database
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # State Management / Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Utils
  intl: ^0.19.0

  # Backup (share the .sqlite snapshot)
  share_plus: ^12.0.2

  # A4 PDF reports
  pdf: ^3.11.1
  printing: ^5.13.4

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.20.0
  build_runner: ^2.4.11
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
