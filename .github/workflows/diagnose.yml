name: Diagnose crash
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
      - run: flutter create . --platforms=android --org com.icecream
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --release --target-platform android-x64
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: |
            adb install -r build/app/outputs/flutter-apk/app-release.apk
            adb logcat -c
            adb shell monkey -p com.icecream.ice_cream_erp -c android.intent.category.LAUNCHER 1
            sleep 20
            adb logcat -d > logcat.txt
            adb shell pidof com.icecream.ice_cream_erp || echo "PROCESS DIED" >> logcat.txt
      - name: Show crash lines
        if: always()
        run: grep -iE "PROCESS DIED|FATAL|AndroidRuntime|flutter|signal|Exception|Error" logcat.txt | head -80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logcat
          path: logcat.txt
