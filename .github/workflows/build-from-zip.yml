name: Build APK from zip

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: work/ice_cream_erp
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        working-directory: .
        run: |
          unzip -q ice_cream_erp_v1.6_final.zip -d work
          ls -a work/ice_cream_erp

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: SQLite for tests
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - run: flutter create . --platforms=android --org com.icecream
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      - run: flutter analyze --no-fatal-infos
        continue-on-error: true
      - run: flutter test
        continue-on-error: true

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: work/ice_cream_erp/build/app/outputs/flutter-apk/app-release.apk
